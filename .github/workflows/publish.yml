name: Publish Composer package

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without creating a GitHub Release
        type: boolean
        default: true

permissions: {}

concurrency:
  group: publish-composer
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'valksor/typesafe-sdk-php'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: packagist
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          extensions: curl, json
          coverage: none
          tools: composer:v2
      - name: Validate release tag and extract changelog notes
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          VERSION="$(python3 .github/scripts/version.py)"
          if [ "$DRY_RUN" = true ]; then
            TAG="v$VERSION"
          else
            test "$REPOSITORY_PRIVATE" = false || { echo 'Repository must be public before Packagist can install the package'; exit 1; }
            test "$GITHUB_REF_TYPE" = tag || { echo 'Select a public version tag for publication'; exit 1; }
            TAG="$GITHUB_REF_NAME"
            git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH" || { echo 'Release tag must be on the public default branch'; exit 1; }
          fi
          python3 .github/scripts/release_notes.py "$TAG" "$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install, analyze, and test public source
        run: |
          composer install --no-interaction --prefer-dist
          composer analyse
          composer lint
          composer test -- --exclude-group integration --fail-on-deprecation
          composer validate --strict
          composer audit
          composer check-platform-reqs
      - name: Build and smoke-test Composer archive
        env:
          COMPOSER_ROOT_VERSION: ${{ steps.release.outputs.version }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir release
          composer archive --format=zip --dir=release --file="typesafe-sdk-php-$VERSION"
          ARCHIVE="$(find release -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$ARCHIVE"
          CONSUMER="$(mktemp -d)"
          unzip -q "$ARCHIVE" -d "$CONSUMER"
          composer install --working-dir="$CONSUMER" --no-dev --no-interaction --prefer-dist --optimize-autoloader
          CONSUMER="$CONSUMER" VERSION="$VERSION" php -r '
            require getenv("CONSUMER") . "/vendor/autoload.php";
            if (\TypeSafe\Client::VERSION !== getenv("VERSION")) { throw new RuntimeException("Version mismatch"); }
            new \TypeSafe\Client(apiKey: "release-smoke-test");
          '
          mv release-notes.md release/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composer-release
          path: release/
          if-no-files-found: error
      - name: Create or update GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release/release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TITLE" --notes-file release/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/*.zip --clobber
      - name: Summarize release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            echo 'Dry run passed. Review the composer-release artifact; no GitHub Release was created.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published $RELEASE_TAG and its tested archive. Packagist consumes this same Git tag through the repository integration." >> "$GITHUB_STEP_SUMMARY"
          fi
